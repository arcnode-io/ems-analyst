[tool.uv.workspace]
members = ["packages/mcp", "packages/agent", "packages/server"]

[tool.uv.sources]
ems-analyst-mcp = { workspace = true }
ems-analyst-agent = { workspace = true }
ems-analyst-server = { workspace = true }

[tool.uv]
# Reason: uv only reads constraint-dependencies from the WORKSPACE ROOT — the
# same block under packages/mcp/[tool.uv] was silently ignored (astral-sh/uv#14900).
# Security floors for transitive deps the resolver otherwise pins low:
constraint-dependencies = [
    "cryptography>=50.0.0",     # PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf
    "pygments>=2.20.0",         # CVE-2026-4539
    "requests>=2.33.0",         # CVE-2026-25645
    "aiohttp>=3.14.3",          # PYSEC-2026-237/2104-2113/3545-3547
    "python-multipart>=0.0.31", # PYSEC-2026-3036/3037/3040
    "urllib3>=2.7.0",           # CVE-2026-44431, CVE-2026-44432
    "joserfc>=1.6.8",           # PYSEC-2026-2528
    "langsmith>=0.8.18",        # GHSA-f4xh-w4cj-qxq8
    "mcp>=1.28.1",              # CVE-2026-52869/52870/59950
    "msgpack>=1.2.1",           # GHSA-6v7p-g79w-8964
    "pyasn1>=0.6.4",            # PYSEC-2026-3455/3456/3457
    "pip>=26.2",                # PYSEC-2026-3721
    "pydantic-settings>=2.14.2",# GHSA-4xgf-cpjx-pc3j
    "starlette>=1.3.1",         # PYSEC-2026-248/249/2280/2281
    "httpcore2>=2.10.0",        # CVE-2026-84381
    "httpx2>=2.12.0",           # CVE-2026-84379/84380/84382
]
